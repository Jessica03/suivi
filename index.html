const oct=t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0));
async function ouvrir(brut){
  const cle=await crypto.subtle.importKey("raw",brut,"AES-GCM",false,["decrypt"]);
  const clair=await crypto.subtle.decrypt({name:"AES-GCM",iv:oct(D.i)},cle,oct(D.c));
  const html=new TextDecoder().decode(clair);
  document.open(); document.write(html); document.close();
}
async function deriver(mdp){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(mdp.normalize("NFC").trim()),"PBKDF2",false,["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",salt:oct(D.s),iterations:D.n,hash:"SHA-256"},base,256));
}
const f=document.getElementById("f"), e=document.getElementById("e");
(async()=>{
  let garde=null; try{ garde=localStorage.getItem(K); }catch(x){}
  if(garde){ try{ await ouvrir(oct(garde)); return; }catch(x){ try{ localStorage.removeItem(K); }catch(y){} } }
  f.hidden=false; document.getElementById("m").focus();
})();
document.getElementById("v").addEventListener("change",ev=>{ document.getElementById("m").type=ev.target.checked?"text":"password"; });
f.addEventListener("submit",async ev=>{
  ev.preventDefault(); e.textContent="";
  if(!(window.crypto&&crypto.subtle)){ e.textContent="Ce navigateur ne permet pas d'ouvrir le site ici. Ouvrez l'adresse en https dans Safari ou Chrome."; return; }
  let etape="calcul";
  try{
    const brut=await deriver(document.getElementById("m").value);
    const garder=document.getElementById("g").checked;
    etape="mdp"; await crypto.subtle.importKey("raw",brut,"AES-GCM",false,["decrypt"]).then(c=>crypto.subtle.decrypt({name:"AES-GCM",iv:oct(D.i)},c,oct(D.c)));
    etape="ouverture";
    if(garder){ try{ localStorage.setItem(K,btoa(String.fromCharCode(...brut))); }catch(x){} }
    await ouvrir(brut);
  }catch(x){ e.textContent = etape==="mdp" ? "Mot de passe incorrect. Vérifiez les majuscules, les espaces et les accents." : "Erreur technique ("+etape+") : "+(x&&x.name||x); }
});
